<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Whimsical Birthday Wish 🌸✨</title>
  <style>
    :root {
      --bg-color: #FFF9F6;
      --card-bg: #FFFFFF;
      --accent-pink: #FF8FA3;
      --soft-pink: #FFF0F3;
      --warm-glow: #FFE5EC;
      --text-main: #5C4B51;
      --text-soft: #8C7A80;
      --gold: #FFB703;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      transition: background-color 1s ease;
    }

    /* Ambient Warm Glow on Blow Out */
    body.all-blown {
      background-color: #FFF2F5;
    }

    .container {
      width: 100%;
      max-width: 440px;
      padding: 28px 24px;
      background: var(--card-bg);
      border-radius: 32px;
      box-shadow: 0 20px 40px rgba(255, 143, 163, 0.12);
      text-align: center;
      position: relative;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent-pink);
      margin-bottom: 6px;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: var(--text-soft);
      margin-bottom: 24px;
    }

    /* Scene Container */
    .scene {
      position: relative;
      height: 220px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      margin-bottom: 20px;
    }

    /* Wish Jar */
    .wish-jar-container {
      position: absolute;
      top: 0;
      right: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .wish-jar {
      width: 44px;
      height: 56px;
      border: 3px solid #E2D4D8;
      border-radius: 8px 8px 16px 16px;
      position: relative;
      background: rgba(255, 255, 255, 0.6);
      overflow: hidden;
      display: flex;
      flex-wrap: wrap-reverse;
      align-content: flex-start;
      padding: 4px;
      gap: 3px;
    }

    .wish-jar::before {
      content: '';
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 6px;
      background: #D8C3C8;
      border-radius: 4px;
    }

    .jar-star {
      width: 10px;
      height: 10px;
      background: var(--gold);
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .jar-label {
      font-size: 0.7rem;
      color: var(--text-soft);
      margin-top: 4px;
      font-weight: 600;
    }

    /* Cute Mascot Companion */
    .mascot {
      position: absolute;
      left: 12px;
      bottom: 20px;
      width: 65px;
      height: 65px;
      transition: transform 0.3s ease;
    }

    .mascot-head {
      width: 50px;
      height: 44px;
      background: #F7D6C8;
      border-radius: 25px 25px 20px 20px;
      position: relative;
      margin: 0 auto;
    }

    .ear {
      width: 14px;
      height: 18px;
      background: #F7D6C8;
      position: absolute;
      top: -8px;
      border-radius: 10px 10px 0 0;
    }
    .ear.left { left: 4px; transform: rotate(-15deg); }
    .ear.right { right: 4px; transform: rotate(15deg); }

    .eye {
      width: 6px;
      height: 6px;
      background: var(--text-main);
      border-radius: 50%;
      position: absolute;
      top: 18px;
    }
    .eye.left { left: 12px; }
    .eye.right { right: 12px; }

    .blush {
      width: 8px;
      height: 5px;
      background: #FFB3C1;
      border-radius: 50%;
      position: absolute;
      top: 24px;
    }
    .blush.left { left: 8px; }
    .blush.right { right: 8px; }

    .mouth {
      width: 8px;
      height: 4px;
      border-bottom: 2px solid var(--text-main);
      border-radius: 0 0 8px 8px;
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
    }

    /* Mascot Animations */
    .mascot.happy {
      animation: bounce 0.6s infinite alternate ease-in-out;
    }

    /* Cake Structure */
    .cake-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .candles-row {
      display: flex;
      gap: 16px;
      margin-bottom: -2px;
      z-index: 2;
    }

    .candle {
      position: relative;
      width: 12px;
      height: 38px;
      background: repeating-linear-gradient(45deg, #FFF, #FFF 4px, #FFC6FF 4px, #FFC6FF 8px);
      border-radius: 4px;
      cursor: pointer;
    }

    /* Flower Bud / Flame */
    .flame-container {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 18px;
      cursor: pointer;
    }

    .flame {
      width: 12px;
      height: 16px;
      background: radial-gradient(circle, #FFE600 20%, #FF5900 100%);
      border-radius: 50% 50% 35% 35%;
      margin: 0 auto;
      box-shadow: 0 0 12px #FF9E00;
      animation: flicker 0.8s infinite alternate ease-in-out;
      transition: all 0.5s ease;
    }

    /* Bloom state replacing smoke */
    .candle.off .flame {
      background: #FF8FA3;
      box-shadow: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      transform: scale(1.2);
      animation: bloom 0.4s ease forwards;
    }

    .candle.off .flame::after {
      content: '🌸';
      font-size: 10px;
      position: absolute;
      top: -2px;
      left: 0;
    }

    /* Cake Layers */
    .cake-top {
      width: 140px;
      height: 40px;
      background: #FFE5EC;
      border-radius: 12px 12px 4px 4px;
      position: relative;
      border-bottom: 4px solid #FFC2D1;
    }

    .cake-base {
      width: 170px;
      height: 50px;
      background: #FFF;
      border: 3px solid #FFE5EC;
      border-radius: 4px 4px 16px 16px;
      box-shadow: inset 0 -8px 0 #FFF0F3;
    }

    /* Floating Star Particles */
    .star-particle {
      position: absolute;
      width: 12px;
      height: 12px;
      background: var(--gold);
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      pointer-events: none;
      z-index: 10;
      transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Control Panel */
    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 10px;
    }

    .btn {
      background: var(--soft-pink);
      color: var(--accent-pink);
      border: 2px solid var(--warm-glow);
      padding: 12px 20px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: var(--accent-pink);
      color: #FFF;
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }

    /* Wish Card Reveal */
    .wish-card {
      margin-top: 20px;
      padding: 18px;
      background: #FFF9FA;
      border: 2px dashed #FFB3C1;
      border-radius: 18px;
      display: none;
      animation: fadeIn 0.8s ease forwards;
    }

    .wish-card.show {
      display: block;
    }

    .wish-card h2 {
      font-size: 1.1rem;
      color: var(--accent-pink);
      margin-bottom: 6px;
    }

    .wish-card p {
      font-size: 0.88rem;
      color: var(--text-main);
      line-height: 1.4;
    }

    /* Keyframes */
    @keyframes flicker {
      0% { transform: scale(1) rotate(-2deg); }
      100% { transform: scale(1.08) rotate(2deg); opacity: 0.95; }
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }

    @keyframes popIn {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Make a Wish 🌸</h1>
    <p class="subtitle">Gently blow into your mic or tap the flames to release your wishes into the jar.</p>

    <div class="scene">
      <!-- Mascot Companion -->
      <div class="mascot" id="mascot">
        <div class="mascot-head">
          <div class="ear left"></div>
          <div class="ear right"></div>
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="blush left"></div>
          <div class="blush right"></div>
          <div class="mouth"></div>
        </div>
      </div>

      <!-- Wish Jar -->
      <div class="wish-jar-container">
        <div class="wish-jar" id="wishJar"></div>
        <span class="jar-label">Wish Jar</span>
      </div>

      <!-- Cake -->
      <div class="cake-container">
        <div class="candles-row">
          <div class="candle" onclick="extinguishCandle(this)">
            <div class="flame-container"><div class="flame"></div></div>
          </div>
          <div class="candle" onclick="extinguishCandle(this)">
            <div class="flame-container"><div class="flame"></div></div>
          </div>
          <div class="candle" onclick="extinguishCandle(this)">
            <div class="flame-container"><div class="flame"></div></div>
          </div>
        </div>
        <div class="cake-top"></div>
        <div class="cake-base"></div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn" id="blowBtn" onclick="simulateBlow()">
        💨 Blow Air
      </button>
      <button class="btn" onclick="resetCandles()">
        🔄 Reset
      </button>
    </div>

    <!-- Heartfelt Wish Card -->
    <div class="wish-card" id="wishCard">
      <h2>✨ Your Wish Has Been Captured! ✨</h2>
      <p>May your upcoming year be soft, joyful, and filled with endless moments that make your heart smile. Keep shining brightly!</p>
    </div>
  </div>

  <script>
    let jarCount = 0;
    const totalCandles = 3;

    function extinguishCandle(candleEl) {
      if (candleEl.classList.contains('off')) return;

      candleEl.classList.add('off');
      
      // Animate star particle flying to jar
      createStarParticle(candleEl);

      // Mascot reaction
      const mascot = document.getElementById('mascot');
      mascot.classList.add('happy');
      setTimeout(() => mascot.classList.remove('happy'), 1200);

      // Add star to jar after flight delay
      setTimeout(() => {
        addStarToJar();
      }, 700);
    }

    function createStarParticle(sourceEl) {
      const rect = sourceEl.getBoundingClientRect();
      const jarRect = document.getElementById('wishJar').getBoundingClientRect();

      const particle = document.createElement('div');
      particle.className = 'star-particle';
      particle.style.left = `${rect.left + 2}px`;
      particle.style.top = `${rect.top - 10}px`;
      document.body.appendChild(particle);

      // Trigger movement to wish jar
      requestAnimationFrame(() => {
        particle.style.left = `${jarRect.left + 14}px`;
        particle.style.top = `${jarRect.top + 16}px`;
        particle.style.opacity = '0.5';
      });

      setTimeout(() => {
        particle.remove();
      }, 800);
    }

    function addStarToJar() {
      const wishJar = document.getElementById('wishJar');
      const star = document.createElement('div');
      star.className = 'jar-star';
      wishJar.appendChild(star);
      
      jarCount++;

      if (jarCount === totalCandles) {
        document.body.classList.add('all-blown');
        document.getElementById('mascot').classList.add('happy');
        setTimeout(() => {
          document.getElementById('wishCard').classList.add('show');
        }, 400);
      }
    }

    function simulateBlow() {
      const activeCandles = document.querySelectorAll('.candle:not(.off)');
      if (activeCandles.length > 0) {
        // Extinguish candles sequentially for a realistic blow effect
        activeCandles.forEach((candle, index) => {
          setTimeout(() => {
            extinguishCandle(candle);
          }, index * 250);
        });
      }
    }

    function resetCandles() {
      document.querySelectorAll('.candle').forEach(c => c.classList.remove('off'));
      document.getElementById('wishJar').innerHTML = '';
      document.getElementById('wishCard').classList.remove('show');
      document.body.classList.remove('all-blown');
      document.getElementById('mascot').classList.remove('happy');
      jarCount = 0;
    }
  </script>
</body>
</html>
