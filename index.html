<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Multiverse Haven | Interactive Experience</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@500;600&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-peach: #FFF5F0;
      --card-glass: rgba(255, 255, 255, 0.88);
      --card-border: rgba(255, 182, 193, 0.6);
      --accent-pink: #FF82A9;
      --accent-gold: #FFD166;
      --text-dark: #2B2D42;
      --font-handwriting: 'Caveat', cursive;
      --font-playful: 'Fredoka', sans-serif;
      --font-main: 'Plus Jakarta Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg-peach);
      color: var(--text-dark);
      font-family: var(--font-main);
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #ambient-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, rgba(25, 15, 35, 0.75) 0%, rgba(10, 5, 15, 0.92) 100%);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }
    body.dimmed #ambient-overlay { opacity: 1; }

    #fx-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 150;
    }

    .app-viewport {
      width: 100%;
      max-width: 440px;
      padding: 1.25rem;
      position: relative;
      z-index: 200;
    }

    .stepper-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(8px);
      padding: 0.6rem 1rem;
      border-radius: 30px;
      border: 1px solid var(--card-border);
    }
    .step-pill {
      font-family: var(--font-playful);
      font-size: 0.85rem;
      color: var(--accent-pink);
      background: #FFF;
      padding: 0.2rem 0.75rem;
      border-radius: 20px;
    }
    .wish-counter-badge {
      font-family: var(--font-handwriting);
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .slide-card {
      background: var(--card-glass);
      backdrop-filter: blur(16px);
      border: 2px solid var(--card-border);
      border-radius: 28px;
      padding: 2rem 1.5rem;
      box-shadow: 0 12px 40px rgba(255, 130, 169, 0.15);
      text-align: center;
    }

    .slide-title {
      font-family: var(--font-handwriting);
      font-size: 2.4rem;
      color: var(--accent-pink);
      line-height: 1.1;
      margin-bottom: 0.4rem;
    }

    .slide-subtitle {
      font-size: 0.95rem;
      color: #666;
      margin-bottom: 1.8rem;
      line-height: 1.4;
    }

    .candle-stage {
      position: relative;
      width: 100%;
      height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      margin-bottom: 1.5rem;
      cursor: pointer;
    }

    .flork-svg {
      width: 130px;
      height: auto;
      position: absolute;
      top: 0;
      z-index: 10;
    }

    .cake-base {
      width: 180px;
      height: 90px;
      background: #FFF0F5;
      border: 3.5px solid var(--text-dark);
      border-radius: 18px 18px 12px 12px;
      position: relative;
      z-index: 20;
      box-shadow: 0 8px 0 #FFB3C6;
    }

    .cake-drip {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 25px;
      background: var(--accent-pink);
      border-radius: 14px 14px 8px 8px;
      border-bottom: 3.5px solid var(--text-dark);
    }

    .candle-stick {
      width: 14px;
      height: 48px;
      background: repeating-linear-gradient(45deg, #FFF, #FFF 6px, var(--accent-pink) 6px, var(--accent-pink) 12px);
      border: 2.5px solid var(--text-dark);
      border-radius: 6px;
      position: absolute;
      top: -42px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
    }

    .flame-element {
      width: 18px;
      height: 28px;
      background: radial-gradient(circle at bottom, #FFD166 20%, #FF82A9 60%, orange 100%);
      border-radius: 50% 50% 20% 20%;
      position: absolute;
      top: -28px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 0 15px #FFD166, 0 0 30px orange;
      animation: flameWobble 0.8s ease-in-out infinite alternate;
      z-index: 30;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    @keyframes flameWobble {
      0% { transform: translateX(-50%) scale(1) rotate(-2deg); }
      100% { transform: translateX(-50%) scale(1.12) rotate(3deg); }
    }

    .flame-element.extinguished {
      opacity: 0;
      transform: translateX(-50%) scale(0.2);
      pointer-events: none;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
    }

    .action-btn {
      width: 100%;
      background: var(--accent-pink);
      color: #FFF;
      border: 2.5px solid var(--text-dark);
      padding: 0.9rem 1.2rem;
      font-family: var(--font-playful);
      font-size: 1.05rem;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--text-dark);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .action-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 var(--text-dark);
    }

    .action-btn.secondary {
      background: #FFF;
      color: var(--text-dark);
    }

    .unlock-banner {
      display: none;
      margin-top: 1rem;
      padding: 0.8rem;
      background: #E8F5E9;
      border: 2px solid #4CAF50;
      border-radius: 16px;
      color: #2E7D32;
      font-family: var(--font-playful);
      font-size: 0.95rem;
      animation: fadeInUp 0.4s ease forwards;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div id="ambient-overlay"></div>
  <canvas id="fx-canvas"></canvas>

  <main class="app-viewport">
    <header class="stepper-bar">
      <span class="step-pill">STAGE 01 / 05</span>
      <div class="wish-counter-badge">
        🌸 <span id="wish-count-display">0</span> Wishes
      </div>
    </header>

    <section class="slide-card">
      <h1 class="slide-title">The Wish Ritual</h1>
      <p class="slide-subtitle">Blow into your microphone or tap the flame to extinguish the candle!</p>

      <div class="candle-stage" id="candle-trigger">
        <svg class="flork-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M 20 80 C 20 40, 30 20, 50 20 C 70 20, 80 40, 80 80" stroke="#2B2D42" stroke-width="3.5" stroke-linecap="round" fill="white"/>
          <circle cx="40" cy="38" r="3" fill="#2B2D42"/>
          <circle cx="60" cy="38" r="3" fill="#2B2D42"/>
          <path d="M 42 48 Q 50 54 58 48" stroke="#2B2D42" stroke-width="3" stroke-linecap="round" fill="none"/>
          <path d="M 38 21 L 50 2 L 62 21 Z" fill="#FF82A9" stroke="#2B2D42" stroke-width="2.5"/>
          <circle cx="50" cy="2" r="3" fill="#FFD166"/>
        </svg>

        <div class="cake-base">
          <div class="cake-drip"></div>
          <div class="candle-stick">
            <div class="flame-element" id="candle-flame"></div>
          </div>
        </div>
      </div>

      <div class="btn-group">
        <button class="action-btn" id="mic-btn">🎙️ Enable Mic Blow-Out</button>
        <button class="action-btn secondary" id="dim-btn">💡 Toggle Dim Lights</button>
      </div>

      <div class="unlock-banner" id="unlock-banner">
        ✨ Wish Saved! Stage 1 Complete.
      </div>
    </section>
  </main>

  <script>
    // Safe Local Storage Engine
    let appState = { wishes: 0, candleBlown: false };
    try {
      const stored = localStorage.getItem('multiverse_haven_state');
      if (stored) appState = JSON.parse(stored);
    } catch (e) {
      console.warn('Storage blocked, falling back to memory state.');
    }

    function saveState() {
      try {
        localStorage.setItem('multiverse_haven_state', JSON.stringify(appState));
      } catch (e) {}
      document.getElementById('wish-count-display').innerText = appState.wishes;
    }
    saveState();

    // Canvas Engine
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    let dpr = window.devicePixelRatio || 1;

    function resizeCanvas() {
      dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Safe Web Audio Engine
    let audioCtx = null;
    function playAudioTone(freq, duration) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // Extinguish Action
    const flame = document.getElementById('candle-flame');
    const cakeTrigger = document.getElementById('candle-trigger');
    const unlockBanner = document.getElementById('unlock-banner');

    function blowOutCandle() {
      if (appState.candleBlown) return;

      appState.candleBlown = true;
      appState.wishes += 1;
      saveState();

      flame.classList.add('extinguished');
      document.body.classList.add('dimmed');
      playAudioTone(261, 0.4);

      spawnSparkles();
      unlockBanner.style.display = 'block';
    }

    cakeTrigger.addEventListener('click', blowOutCandle);

    document.getElementById('dim-btn').addEventListener('click', () => {
      document.body.classList.toggle('dimmed');
      playAudioTone(440, 0.1);
    });

    // Mic Blow-Out Handler
    const micBtn = document.getElementById('mic-btn');
    micBtn.addEventListener('click', async () => {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert("Microphone access is blocked in this view mode. Tap the candle directly!");
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const micCtx = new (window.AudioContext || window.webkitAudioContext)();
        const analyzer = micCtx.createAnalyser();
        const micSource = micCtx.createMediaStreamSource(stream);
        micSource.connect(analyzer);
        analyzer.fftSize = 256;
        const dataArray = new Uint8Array(analyzer.frequencyBinCount);

        micBtn.innerText = "🎙️ Listening... Blow now!";
        micBtn.style.background = "#4CAF50";

        function checkMic() {
          if (appState.candleBlown) return;
          analyzer.getByteFrequencyData(dataArray);
          let sum = dataArray.reduce((a, b) => a + b, 0);
          if ((sum / dataArray.length) > 40) {
            blowOutCandle();
            micBtn.innerText = "💨 Blow Detected!";
            stream.getTracks().forEach(t => t.stop());
            return;
          }
          requestAnimationFrame(checkMic);
        }
        checkMic();
      } catch (err) {
        alert("Microphone requires HTTPS or direct browser window. Tap the candle flame instead!");
      }
    });

    // Particle Burst Canvas
    let particles = [];
    function spawnSparkles() {
      const rect = flame.getBoundingClientRect();
      for (let i = 0; i < 25; i++) {
        particles.push({
          x: rect.left + rect.width / 2,
          y: rect.top,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 1) * 5,
          alpha: 1,
          size: Math.random() * 4 + 2,
          color: ['#FFD166', '#FF82A9', '#FFF'][Math.floor(Math.random() * 3)]
        });
      }
    }

    function renderFX() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      particles.forEach((p) => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.fill();
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.025;
      });
      particles = particles.filter(p => p.alpha > 0);
      requestAnimationFrame(renderFX);
    }
    renderFX();
  </script>
</body>
</html>
